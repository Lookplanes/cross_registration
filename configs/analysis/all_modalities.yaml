# Unified modality configuration for full modality landscape analysis.
#
# center: true  →  the 6 hub modalities (highlighted in visualizations)
# center: false →  collected modalities from BioImage Archive (shown as "Other")
#
# Usage:
#   python scripts/run_full_tsne.py --config configs/analysis/all_modalities.yaml

modalities:
  # =========================================================================
  # 6 Center / Hub Modalities
  # =========================================================================
  2PM:
    source_dir: 2PM/processed/Movie7_EP/channels
    glob_pattern: "t???_c*"
    data_root: /data2/wuyh
    center: true

  Confocal:
    source_dir: confocal/processed
    glob_pattern: "*"
    data_root: /data2/wuyh
    center: true

  Fluorescence:
    source_dir: fluorescence/processed
    glob_pattern: "*"
    data_root: /data2/wuyh
    center: true

  H&E:
    source_dir: H&E/processed
    glob_pattern: "*"
    data_root: /data2/wuyh
    center: true

  MACSima:
    source_dir: MACSima/processed
    glob_pattern: "**/*"
    data_root: /data2/wuyh
    center: true

  MSI:
    source_dir: MSI/processed
    glob_pattern: "**/*"
    data_root: /data2/wuyh
    center: true

  # =========================================================================
  # Collected Modalities (BioImage Archive)
  # =========================================================================
  Brightfield_HE_WSI:
    source_dir: brightfield_he_wsi
    glob_pattern: "**/*"
    data_root: /data2/xujr/general_data/collected_modalities_processed2
    center: false

  Brightfield_IHC_2D:
