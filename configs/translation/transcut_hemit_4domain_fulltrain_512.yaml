# Stable four-domain registry for the complete official HEMIT train split.
# H&E is RGB; marker PNGs are grayscale on disk and are replicated to RGB by
# the shared loader because the current TransCUT contract uses channels=3.
modalities:
  - id: 0
    name: he
    path: /data2/wuyh/HEMIT/dataset/processed_3717_150_150_512/train/he
    channels: 3
  - id: 1
    name: dapi
    path: /data2/wuyh/HEMIT/dataset/processed_3717_150_150_512/train/dapi
    channels: 3
  - id: 2
    name: panck
    path: /data2/wuyh/HEMIT/dataset/processed_3717_150_150_512/train/panck
    channels: 3
  - id: 3
    name: cd3
    path: /data2/wuyh/HEMIT/dataset/processed_3717_150_150_512/train/cd3
    channels: 3
